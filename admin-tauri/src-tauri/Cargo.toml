[package]
name = "apna-billing-admin"
version = "1.1.0"
description = "Apna Billing Admin desktop shell"
edition = "2021"

[lib]
name = "apna_billing_admin_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
