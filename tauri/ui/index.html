<!doctype html>
<!-- Shown the instant the window opens, while the local engine starts (then the window moves on to the app).
     Same colours as the app's first screen, so there is no white flash. -->
<html><head><meta charset="utf-8"><title>Apna Billing</title>
<style>
  html,body{margin:0;height:100%;background:#eef3f0;color:#0f172a;font:15px "Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none;cursor:default}
  body{display:grid;place-items:center}
  .box{display:flex;flex-direction:column;align-items:center;gap:14px}
  img{width:88px;height:88px;filter:drop-shadow(0 10px 18px rgba(5,150,105,.25))}
  b{font-size:22px;font-weight:700;letter-spacing:-.01em}
  .bar{width:140px;height:3px;border-radius:3px;background:#e2e8f0;overflow:hidden}
  .bar i{display:block;width:40%;height:100%;border-radius:3px;background:#10b981;animation:go 1s ease-in-out infinite}
  @keyframes go{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
</style>
</head><body data-tauri-drag-region>
  <div class="box" data-tauri-drag-region>
    <img src="icon.png" alt="" draggable="false">
    <b>Apna Billing</b>
    <div class="bar"><i></i></div>
  </div>
</body></html>
